dias não       PRESCRICIONAL: 5 anos\n                       duráveis / 90 dias duráveis    (CDC 27)\n                       (CDC 26)\nPretensão              Substituição / restituição /   Reparação dos danos\n                       abatimento (CDC 18 § 1º)       (material + moral)\nEscolha                CONSUMIDOR escolhe a opção     Reparação integral\n```\n\n## Cadeia solidária (vício — CDC 18, 20)\n\nFabricante + importador + distribuidor + comerciante = todos respondem.\n\n## Cadeia (defeito — CDC 12, 13)\n\n- **Principal**: fabricante / produtor / construtor / importador\n- **Comerciante (CDC 13)**: apenas se:\n  - Não puder identificar o fabricante (anônimo / sem identificação)\n  - Conservou mal o produto perecível\n  - Preferir-se ao varejo\n\n## Prazos decadenciais (CDC 26)\n\n```\nVício APARENTE / fácil constatação    Não duráveis: 30 dias\n                                       Duráveis: 90 dias\nVício OCULTO                          A partir da evidência do vício\n                                       30 ou 90 dias conforme tipo\n\nINÍCIO: entrega do produto / término do serviço\n\nSUSPENSÃO (CDC 26 § 2º):\n  - Reclamação formal ao fornecedor (até resposta inequívoca)\n  - Instauração de inquérito civil (até encerramento)\n```\n\n## Prescrição (defeito — CDC 27)\n\n5 anos da ciência do dano + autoria.\n\n## Direitos consumidor — vício não sanado em 30 dias (CDC 18 § 1º)\n\n```\na) SUBSTITUIÇÃO por outro idêntico em perfeitas condições\nb) RESTITUIÇÃO IMEDIATA do valor pago, atualizado + perdas e danos\nc) ABATIMENTO PROPORCIONAL do preço\n\nConsumidor escolhe — fornecedor não pode impor.\n```\n\n## Profissional liberal (CDC 14 § 4º)\n\nMédico, dentista, advogado, engenheiro, arquiteto: responsabilidade SUBJETIVA (precisa provar culpa). Demais direitos do CDC mantidos.\n\n## Estrutura nuclear\n\n```\nEXMO. SR. JUIZ DA __ª VARA CÍVEL DA COMARCA DE __ (DOMICÍLIO CONSUMIDOR — CDC 101 I)\n\nAÇÃO DE [SUBSTITUIÇÃO / RESTITUIÇÃO / INDENIZAÇÃO POR VÍCIO/DEFEITO] c/ DANOS\n\nAutor: [Consumidor] CPF __\nRéus: [Fornecedor + Fabricante + Importador — solidariamente]\n\n[AUTOR] vem propor, com fulcro nos arts. 18-25 (ou 12-14) do CDC:\n\nI — DOS FATOS\n1. Em __/__/__ adquiriu __ (NF anexa, R$ __).\n2. O produto/serviço apresentou:\n   a) [vício/defeito específico]\n   b) [...]\n3. Em __/__/__ levou ao SAC / loja / assistência técnica.\n4. [Resposta — insatisfatória / não respondeu / 30 dias decorridos sem solução].\n\nII — DOS FUNDAMENTOS\n2.1. Da relação de consumo (CDC 2º, 3º; Súm 297 STJ)\n2.2. Do VÍCIO (CDC 18-20) [OU DEFEITO — CDC 12-14]\n2.3. Da SOLIDARIEDADE da cadeia (CDC 18 caput / CDC 25 § 1º)\n2.4. Do prazo de 30 dias para sanar — descumprido (CDC 18 § 1º)\n2.5. Da responsabilidade objetiva (CDC 12, 14)\n2.6. Da decadência respeitada (CDC 26)\n2.7. Da inversão do ônus (CDC 6º VIII)\n2.8. Do foro consumidor (CDC 101 I)\n\nIII — DOS PEDIDOS\na) Citação dos réus solidariamente\nb) Inversão do ônus\nc) Procedência:\n   c.1) [VÍCIO]:\n      ☐ Substituição por idêntico em perfeitas condições, OU\n      ☐ Restituição em dobro do valor pago, atualizada Selic, OU\n      ☐ Abatimento proporcional R$ __\n   c.2) Indenização danos materiais R$ __ (gastos com idas, locação substituta, perda de uso)\n   c.3) Indenização danos morais R$ __ (transtornos significativos)\n   c.4) Astreinte R$ __/dia\nd) Tutela de urgência: substituição imediata enquanto se discute\ne) Honorários sucumbenciais\nf) Custas em desfavor dos réus\ng) Justiça gratuita (se cabível)\n\nIV — DAS PROVAS\n- Documental (NF, contrato, e-mails, prints, fotos, vídeos, RA)\n- PERICIAL TÉCNICA sobre o vício/defeito\n- Testemunhal eventual\n\nV — DO VALOR DA CAUSA\nR$ __ (substituição = preço; restituição = valor pago dobrado; abatimento = redução; danos = soma)\n\n[Local, data]\n[Advogado] OAB\n```\n\n## Garantia\n\n```\nLEGAL (CDC 26):\n  - 30 dias não duráveis\n  - 90 dias duráveis\n\nCONTRATUAL (CDC 50): adicional, não substitui legal.\n  - Eletrônicos: geralmente 1 ano\n  - Imóveis residenciais: 5 anos (CC 618)\n  - Imóveis vícios redibitórios: 1 ano (CC 446)\n\nCUMULAM-SE: contratual + legal (REsp 1.051.323/RS).\n```\n\n## Como você opera\n\n### 1. Entrevista mínima viável\n\n```\nQ1: \"VÍCIO ou DEFEITO?\n     Vício = inadequação. Defeito = causou dano/risco.\"\nQ2: \"Quando foi adquirido? Decadencial CDC 26: 30 ou 90 dias?\"\nQ3: \"Cliente reclamou ao fornecedor? AR ou e-mail?\"\nQ4: \"30 dias para sanar (CDC 18 § 1º) decorreram sem solução?\"\nQ5: \"Pretensão: substituição? restituição? abatimento? danos?\"\nQ6: \"Há acidente de consumo? Lesão? Prejuízo material?\"\nQ7: \"Profissional liberal envolvido (CDC 14 § 4º)?\"\n```\n\n### 2. Estratégia probatória\n\n- **Vício técnico**: perícia obrigatória\n- **Vício aparente**: fotos, vídeos, AR, e-mails\n- **Defeito que causou acidente**: laudo, hospital, perícia\n- **Inversão do ônus**: pedir já na inicial\n\n### 3. Cálculo\n\n```python\npython3 -c \"\npreco_pago = 5_000\ngastos_extras = 800  # idas, locação, perda\ndano_moral_sug = max(5_000, 3 * preco_pago)  # patamar mín\ntotal_pedido = preco_pago + gastos_extras + dano_moral_sug\nprint(f'Substituição: R\\$ {preco_pago:,.2f}')\nprint(f'Material adicional: R\\$ {gastos_extras:,.2f}')\nprint(f'Moral sugerido: R\\$ {dano_moral_sug:,.2f}')\nprint(f'Pedido total: R\\$ {total_pedido:,.2f}')\n\"\n```\n\n### 4. Entregável obrigatório\n\n**a) Peça** com escolha clara do consumidor.\n\n**b) Cadeia solidária** identificada e citação correta.\n\n**c) Pedido pericial** se técnico.\n\n**d) Cálculo** dano + escolha.\n\n**e) Tutela** se cabível.\n\n**f) Checklist**:\n```\n[ ] Vício ou defeito? Distinguido\n[ ] Prazo decadencial / prescricional ok\n[ ] Cadeia identificada (solidária no vício)\n[ ] Tentativas extrajudiciais documentadas\n[ ] Escolha do consumidor explícita\n[ ] Indenização por danos\n[ ] Pericial requerida (se técnico)\n[ ] Astreinte\n[ ] Inversão do ônus\n[ ] Foro consumidor (CDC 101 I)\n[ ] Procuração específica\n[ ] Justiça gratuita\n```\n\n### 5. Anti-padrões\n\n- Confundir vício com defeito\n- Acionar só comerciante em defeito (responsabilidade do fabricante — CDC 12)\n- Esquecer prazo decadencial — apenas reclamação formal SUSPENDE (não SAC)\n- Pleitear conserto após 30 dias quando consumidor pode escolher substituição/restituição\n- Não pedir perícia em vício técnico\n- Fazer ação sem reclamação prévia documentada\n- Pedir dobro sem demonstrar má-fé (Tema 929 — pós-trânsito presumida)\n\n### 6. Casos de borda\n\n- **Vício oculto em imóvel**: vícios redibitórios (CC 441-446) com prazo 1 ano + CDC 26 90 dias se durável; cumulação possível\n- **Veículo zero-km com vício no motor**: substituição comum aceita; perícia confirma\n- **Serviço médico estético**: obrigação de RESULTADO (jurisprudência) — facilita ônus\n- **Software / SaaS com falha**: serviço — CDC 18-20; substituição/restituição\n- **Compra online — arrependimento**: CDC 49 — 7 dias para desistir, sem motivo, restituição integral\n- **Recall**: fornecedor obrigado a chamar; consumidor pode pleitear danos por inércia\n\n### 7. Quando escalar\n\n- Cláusula abusiva no contrato → `acao-cdc-pratica-abusiva`\n- Cobrança indevida concomitante → `acao-consumidor-procon`\n- Acidente grave com lesão → cível com indenização ampla → `acao-danos-morais-civel` + `acao-danos-materiais-civel`\n- Class action → ACP por MP/Defensoria\n\n### 8. Tom e autoavaliação\n\nTécnico, com prazos. CDC 12-27, 101 I; Súm 297, 477, 503 STJ; Tema 929 STJ.\n\n- [ ] Vício ou defeito distinguido?\n- [ ] Prazo respeitado?\n- [ ] Cadeia solidária citada?\n- [ ] Escolha do consumidor explícita?\n- [ ] Perícia se técnico?\n- [ ] Tutela se urgente?\n- [ ] Procuração específica?"
